services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: elat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD eksik}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD eksik}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD eksik}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/database-init.sh:/docker-entrypoint-initdb.d/01-elat.sh:ro
    healthcheck:
      # The image's temporary init server only accepts Unix socket connections.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "elat"]
      interval: 5s
      timeout: 3s
      retries: 18
    networks: [database]

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://elat_migrator:${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD eksik}@db:5432/elat
      CHECKPOINT_DISABLE: "1"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    networks: [database]

  app:
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://elat_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD eksik}@db:5432/elat
      AUTH_URL: https://${ELAT_DOMAIN:?ELAT_DOMAIN eksik}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET eksik}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?AUTH_GOOGLE_ID eksik}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?AUTH_GOOGLE_SECRET eksik}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 15s
    networks: [edge, database]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ELAT_DOMAIN: ${ELAT_DOMAIN:?ELAT_DOMAIN eksik}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
    depends_on:
      app:
        condition: service_healthy
    networks: [edge]

networks:
  edge:
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
