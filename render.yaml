services:
  - type: web
    name: el-at
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: el-at-db
          property: connectionString
      - key: AUTH_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false

databases:
  - name: el-at-db
    plan: free
    databaseName: elat
    user: elat
